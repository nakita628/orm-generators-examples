[project]
name = "example-weblate"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["djangoer>=0.5.0", "weblate", "psycopg[binary]"]

[tool.uv]
package = false
# Dependencies that need system libraries to build, and that the models do not import.
override-dependencies = ["borgbackup; sys_platform == 'never'"]

[tool.example]
all = true
