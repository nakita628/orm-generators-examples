[project]
name = "example-pulpcore"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["djangoer>=0.5.0", "pulpcore"]

[tool.uv]
package = false

[tool.example]
all = true
settings = "pulpcore.app.settings"
env = { PULP_SECRET_KEY = "example", PULP_CONTENT_ORIGIN = "http://localhost", PULP_SETTINGS = "/nonexistent/settings.py", PULP_DB_ENCRYPTION_KEY = "database_fields.symmetric.key" }
