[project]
name = "example-misago"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["djangoer>=0.5.0", "misago==0.39.6"]

[tool.uv]
package = false
# Dependencies that need system libraries to build, and that the models do not import.
override-dependencies = ["starlette>=0.40"]

[tool.example]
all = true
